# @-mention conversion test cases
# Run: source .env && npx promptfoo@latest eval --tests datasets/mentions.yaml --prompts prompts/english-messaging-screen-mentions.txt

# =============================================================================
# Basic @-mention conversion
# =============================================================================

- description: "Single @-mention with first name"
  vars:
    input: "hey at Alice can you review the PR"
    vocabularyHints: "Alice Johnson, Bob Smith"
  assert:
    - type: contains
      value: "@Alice"
    - type: not-contains
      value: "at Alice"
    - type: contains
      value: "review"

- description: "Single @-mention with full name"
  vars:
    input: "at Bob Smith can you check the deploy"
    vocabularyHints: "Alice Johnson, Bob Smith"
  assert:
    - type: contains
      value: "@Bob"
    - type: not-contains
      value: "at Bob"
    - type: contains
      value: "deploy"

- description: "Multiple @-mentions in one sentence"
  vars:
    input: "at Alice and at Bob please review the changes"
    vocabularyHints: "Alice Johnson, Bob Smith"
  assert:
    - type: contains
      value: "@Alice"
    - type: contains
      value: "@Bob"

- description: "No conversion when name not in screen vocabulary"
  vars:
    input: "at Charlie can you help with this"
    vocabularyHints: "Alice Johnson, Bob Smith"
  assert:
    - type: not-contains
      value: "@Charlie"

- description: "No conversion for 'at' as preposition"
  vars:
    input: "let's meet at the office at three"
    vocabularyHints: "Alice Johnson, Bob Smith"
  assert:
    - type: not-contains
      value: "@the"
    - type: not-contains
      value: "@three"
    - type: contains
      value: "office"

- description: "Redundant 'at at' cleaned up"
  vars:
    input: "hey at at Alice can you check this"
    vocabularyHints: "Alice Johnson, Bob Smith"
  assert:
    - type: contains
      value: "@Alice"
    - type: not-contains
      value: "at at"
    - type: not-contains
      value: "at @"

- description: "@-mention preserves surrounding text"
  vars:
    input: "hey at Alice I pushed the fix can you take a look"
    vocabularyHints: "Alice Johnson, Dan Lee"
  assert:
    - type: contains
      value: "@Alice"
    - type: contains
      value: "pushed"
    - type: contains
      value: "fix"
