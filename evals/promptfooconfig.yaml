# Kol LLM Post-Processing Eval Suite
# Run: GROQ_API_KEY=xxx npx promptfoo@latest eval
# View: npx promptfoo@latest view

description: "Kol ASR post-processing quality evaluation"

maxConcurrency: 1

providers:
  - id: openai:chat:openai/gpt-oss-120b
    label: groq-gpt-oss-120b
    config:
      apiBaseUrl: https://api.groq.com/openai/v1
      apiKeyEnvar: GROQ_API_KEY
      temperature: 0
      max_tokens: 4096
      reasoning_effort: low
      # Kol consumes message.content and excludes the separate reasoning field.
      showThinking: false

defaultTest:
  options:
    provider:
      # Keep the grading model independent of the candidate model.
      id: openai:chat:qwen/qwen3.8-27b
      config:
        apiBaseUrl: https://api.groq.com/openai/v1
        apiKeyEnvar: GROQ_API_KEY
        temperature: 0
  assert:
    # Universal: output must never contain preamble
    - type: not-contains
      value: "Here is"
    - type: not-contains
      value: "Sure,"
    - type: not-contains
      value: "here's"
    - type: not-contains
      value: "Here's"
    - type: not-contains
      value: "Certainly"

# --- English: General ---
prompts:
  - label: english-general
    raw: file://prompts/english-general.txt
  - label: english-code
    raw: file://prompts/english-code.txt
  - label: english-messaging
    raw: file://prompts/english-messaging.txt
  - label: english-document
    raw: file://prompts/english-document.txt
  - label: english-messaging-screen
    raw: file://prompts/english-messaging-screen.txt

tests: file://datasets/english.yaml

# To run specific suites, use:
#   npx promptfoo eval --tests datasets/hebrew.yaml --prompts prompts/hebrew-general.txt
